<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101119">
  <title>掷骰台 · Random Check</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="dice-meshes.js"></script>
  <script defer src="motion.js"></script>
  <script defer src="roll.js"></script>
</head>
<body>
  <main class="workbench">
    <header class="masthead">
      <div class="wordmark"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> RANDOM CHECK</div>
      <span class="random-source"><i aria-hidden="true"></i> 网页随机数</span>
    </header>

    <div class="setup">
      <h1>掷骰台</h1>
      <form id="roll-form">
        <div class="bounds">
          <label for="lower">最小值<input id="lower" name="lower" type="number" min="3" max="30" step="1" value="3" required></label>
          <span class="range-line" aria-hidden="true"></span>
          <label for="upper">最大值<input id="upper" name="upper" type="number" min="3" max="30" step="1" value="30" required></label>
        </div>
        <button id="roll-button" type="submit"><span class="button-mark" aria-hidden="true"><i></i></span><span id="button-label">掷骰子</span></button>
        <p class="input-error" id="input-error" role="alert" hidden></p>
      </form>
    </div>

    <div class="play-area" id="play-area">
      <div class="stage-toolbar">
        <fieldset class="mode-picker" id="mode-picker">
          <legend class="screen-reader-only">骰台样式</legend>
          <label class="mode-option">
            <input class="screen-reader-only" type="radio" name="dice-mode" value="flat" checked>
            <span class="mode-body"><span class="mode-code">2D</span>卡通骰</span>
          </label>
          <label class="mode-option">
            <input class="screen-reader-only" type="radio" name="dice-mode" value="solid">
            <span class="mode-body"><span class="mode-code">3D</span>镜面骰</span>
          </label>
        </fieldset>
        <span class="stage-state" id="stage-state">待投掷</span>
      </div>
      <section class="stage flat" id="dice-stage" aria-label="2D 卡通骰">
        <canvas id="dice-canvas" aria-hidden="true"></canvas>
        <div class="stage-footer"><span id="dice-labels" data-dice></span></div>
      </section>
    </div>

    <section id="receipt" class="receipt" aria-label="随机结果">
      <output class="result-number" id="result" for="lower upper" aria-label="随机结果">–</output>
      <div class="receipt-copy">
        <div class="receipt-heading"><h2>本次结果</h2><span id="range-summary" class="range-summary">3 – 30</span></div>
        <p id="calculation" aria-live="polite">设定范围后，点击「掷骰子」。</p>
      </div>
    </section>
  </main>
</body>
</html>
